name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR revisions share a group; every push to main gets its own so a queued run is never replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run every OS so a platform break is caught before merge.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The vendored plugin validator imports yaml.
      - run: python -m pip install PyYAML==6.0.2
      - run: bun install --frozen-lockfile --omit optional
      - name: Smoke test the global Harnest CLI
        env:
          HARNEST_INSTALL_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HARNEST_INSTALL_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/global-cli-smoke.mjs
      - run: bun run check
      - run: bun run smoke:mcp
      - run: bun run smoke:mcp --bridge
      - run: bun run validate:plugin

  memory:
    name: memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run every OS so a platform break is caught before merge.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: bun install --frozen-lockfile --omit optional
      - run: node scripts/check-mcp-memory.mjs --budget-mib 120
      - name: Check shared daemon memory and repeated status response bytes
        run: node scripts/check-daemon-memory.mjs
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harnest-mcp-memory-${{ matrix.os }}
          path: harnest-mcp-memory.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harnest-daemon-memory-${{ matrix.os }}
          path: harnest-daemon-memory.json
          if-no-files-found: error
