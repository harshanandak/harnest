# Monthly, grouped version updates so a quiet repo gets at most one PR per ecosystem.
# Security updates still arrive as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
