name: Bug report
description: Something in Harnest does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, tokens, private source, transcripts, and machine-specific paths before you submit.
  - type: input
    id: version
    attributes:
      label: Harnest version
      description: The release tag or commit you installed (`git -C <harnest checkout> describe --tags --always`).
    validations:
      required: true
  - type: input
    id: hosts
    attributes:
      label: Lead agent and downstream target
      description: For example, "Codex lead, handing off to Claude Code".
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, Bun version, and the downstream CLI version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or the handoff request that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `bun run doctor --host <your lead host>`, with private details removed.
      render: text
