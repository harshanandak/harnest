<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Harnest</title>
  <desc id="desc">A lead coding agent hands tasks through the Harnest MCP daemon to native coding agents and gets validated receipts back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171d38"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#1fc8e8"/>
    </linearGradient>
    <style>
      .label { font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.6px; fill: #8b96c9; }
      .text { font: 500 15px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8ebff; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e8ebff; }
      .tag { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa5d6; }
      .foot { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #7f8abb; }
      .wire { fill: none; stroke: #2f3a66; stroke-width: 2; }
      .flow { fill: none; stroke: #4fd6f0; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 12; animation: flow 1.4s linear infinite; }
      .back { stroke: #a48bff; animation-direction: reverse; }
      .chip { fill: #1b2242; stroke: #313d70; }
      .dot { fill: #3ddc97; animation: blink 2.8s ease-in-out infinite; }
      .ring { fill: none; stroke: #7c5cff; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @keyframes pulse { from { transform: scale(1); opacity: .6; } to { transform: scale(1.45); opacity: 0; } }
      @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .ring, .dot { animation: none; } }
    </style>
  </defs>

  <rect width="960" height="300" rx="18" fill="url(#bg)"/>

  <!-- Lead client -->
  <rect x="40" y="98" width="210" height="104" rx="14" fill="#1b2242" stroke="#313d70"/>
  <text x="62" y="128" class="label">YOUR LEAD AGENT</text>
  <text x="62" y="156" class="text">Claude Code · Codex</text>
  <text x="62" y="180" class="text">Cursor · OpenCode · Pi</text>

  <!-- Lead to hub -->
  <path class="wire" d="M250 140 H420"/>
  <path class="flow" d="M250 140 H420"/>
  <path class="wire" d="M250 162 H420"/>
  <path class="flow back" d="M250 162 H420"/>
  <text x="335" y="130" class="tag" text-anchor="middle">task</text>
  <text x="335" y="182" class="tag" text-anchor="middle">receipt</text>

  <!-- Hub -->
  <circle cx="480" cy="150" r="60" class="ring"/>
  <circle cx="480" cy="150" r="60" fill="url(#hub)"/>
  <text x="480" y="150" text-anchor="middle" style="font: 700 22px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">harnest</text>
  <text x="480" y="170" text-anchor="middle" style="font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #eef0ff;">MCP daemon</text>

  <!-- Hub to downstream agents -->
  <g>
    <path class="wire" d="M540 150 C620 150 620 42 720 42"/>
    <path class="flow" d="M540 150 C620 150 620 42 720 42"/>
    <path class="wire" d="M540 150 C620 150 620 74 720 74"/>
    <path class="flow" style="animation-delay: -.2s" d="M540 150 C620 150 620 74 720 74"/>
    <path class="wire" d="M540 150 C620 150 620 106 720 106"/>
    <path class="flow" style="animation-delay: -.4s" d="M540 150 C620 150 620 106 720 106"/>
    <path class="wire" d="M540 150 C620 150 620 138 720 138"/>
    <path class="flow" style="animation-delay: -.6s" d="M540 150 C620 150 620 138 720 138"/>
    <path class="wire" d="M540 150 C620 150 620 170 720 170"/>
    <path class="flow" style="animation-delay: -.8s" d="M540 150 C620 150 620 170 720 170"/>
    <path class="wire" d="M540 150 C620 150 620 202 720 202"/>
    <path class="flow" style="animation-delay: -1s" d="M540 150 C620 150 620 202 720 202"/>
    <path class="wire" d="M540 150 C620 150 620 234 720 234"/>
    <path class="flow" style="animation-delay: -1.2s" d="M540 150 C620 150 620 234 720 234"/>
    <path class="wire" d="M540 150 C620 150 620 266 720 266"/>
    <path class="flow" style="animation-delay: -1.4s" d="M540 150 C620 150 620 266 720 266"/>
  </g>

  <text x="720" y="20" class="label">NATIVE AGENTS</text>
  <g>
    <rect x="720" y="29" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="42" r="4" class="dot"/>
    <text x="752" y="47" class="mono">claude</text>
    <rect x="720" y="61" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="74" r="4" class="dot" style="animation-delay: -.35s"/>
    <text x="752" y="79" class="mono">codex</text>
    <rect x="720" y="93" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="106" r="4" class="dot" style="animation-delay: -.7s"/>
    <text x="752" y="111" class="mono">opencode</text>
    <rect x="720" y="125" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="138" r="4" class="dot" style="animation-delay: -1.05s"/>
    <text x="752" y="143" class="mono">pi</text>
    <rect x="720" y="157" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="170" r="4" class="dot" style="animation-delay: -1.4s"/>
    <text x="752" y="175" class="mono">cursor</text>
    <rect x="720" y="189" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="202" r="4" class="dot" style="animation-delay: -1.75s"/>
    <text x="752" y="207" class="mono">gemini</text>
    <rect x="720" y="221" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="234" r="4" class="dot" style="animation-delay: -2.1s"/>
    <text x="752" y="239" class="mono">amp</text>
    <rect x="720" y="253" width="200" height="26" rx="13" class="chip"/>
    <circle cx="738" cy="266" r="4" class="dot" style="animation-delay: -2.45s"/>
    <text x="752" y="271" class="mono">acp</text>
    <text x="906" y="271" class="tag" text-anchor="end">registered</text>
  </g>

  <text x="40" y="268" class="foot">Durable handoffs · dependency graphs · validated receipts</text>
</svg>
